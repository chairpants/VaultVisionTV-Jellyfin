overview: "Simulated 90s cable channels streamed from archive.org, as Jellyfin Live TV"
description: >
  VaultVisionTV turns a library of classic TV and movies streamed from the
  Internet Archive into always-on broadcast channels with deterministic,
  wall-clock-driven scheduling — flip to a channel and land mid-show, exactly
  like real cable, the same way for every viewer at once. Integrates as a
  Jellyfin Live TV source (M3U tuner + XMLTV guide) so it works on every
  Jellyfin client.
